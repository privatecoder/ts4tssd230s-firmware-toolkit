; FWVerDB.ini — firmware-compatibility whitelist for the SM2259 vendor flash tool.
;
; Reconstructed from disassembly of CheckBinISPVerWithFlash(). It lets the
; `update` / `swap` (in-place) modes accept the 22Z4W14B -> 22Z4X4IA transition,
; which they otherwise refuse with "./REGBIN/2259/FWVerDB.ini not exist!".
;
; ==> EXPERIMENTAL. This asserts a firmware compatibility the vendor did NOT ship
;     or sanction (their process uses the destructive `keepsn_1`). Passing this
;     gate does NOT guarantee your data is preserved — the in-place write may
;     still wipe or corrupt. TEST ON A SCRATCH DRIVE with known/backed-up data.
;     See "Non-destructive firmware update (experimental)" in
;     TS-SSD230S-Firmware-Update.md.
;
; To use: copy to  ts-ssd230s-fw-update/REGBIN/2259/FWVerDB.ini  then run
;   ./SM2258TLC_3D_LinuxTool_64 /dev/sdX update
;
; Format (from the tool):
;   [UPDATE_FWTable]   FWVer_N        = a firmware version that may exist on a drive
;   [UPDATE_<ver>]     FWSupportVer_N = bin versions allowed to update a <ver> drive
;   (SWAP_* sections are the equivalents used by `swap` / `swap_1`)

[UPDATE_FWTable]
FWVer_1=22Z4W14B

[UPDATE_22Z4W14B]
FWSupportVer_1=22Z4X4IA

[SWAP_FWTable]
FWVer_1=22Z4W14B

[SWAP_22Z4W14B]
FWSupportVer_1=22Z4X4IA
